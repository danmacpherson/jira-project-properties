[project]
name = "jira-project-properties"
version = "0.1.0"
description = "A small CLI to view, set, and delete Jira project entity properties"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]

[project.scripts]
jira-props = "jira_project_properties.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_project_properties"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
